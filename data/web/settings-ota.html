<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>OTA Settings</title>
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <div class="main">
    <h3>&#127811; OTA Settings &#127811;</h3>
    <div class="row"><a class="btn" href="/settings">Back</a></div>
    <div class="msg" id="msg" style="display:none;"></div>
    <fieldset>
      <form method="POST" action="/settings/ota_save">
        OTA user:<br><input id="ota_user" name="ota_user" maxlength="23"><br><br>
        OTA pass:<br><input id="ota_pass" name="ota_pass" type="password" maxlength="23"><br><br>
        <label><input id="web_login_required" type="checkbox" name="web_login_required" value="1"> Require Web UI login</label><br>
        <small>Uses OTA user/password credentials.</small><br><br>
        <button type="submit">Save OTA Settings</button>
      </form>
    </fieldset>
  </div>
  <script>
    fetch('/api/ui/settings/ota', {cache: 'no-store'}).then(r => r.json()).then(d => {
      document.getElementById('ota_user').value = d.user || '';
      document.getElementById('ota_pass').value = d.pass || '';
      document.getElementById('web_login_required').checked = !!d.web_login_required;
    });
    const q = new URLSearchParams(window.location.search);
    let t = '';
    if (q.get('saved') === '1') t = 'Settings saved.';
    if (q.get('saved') === '0') t = 'No changes detected.';
    if (t) { const m=document.getElementById('msg'); m.style.display='block'; m.textContent=t; }
  </script>
</body>
</html>
