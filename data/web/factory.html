  <title>Factory Reset</title>
  <link rel="stylesheet" href="/ui/app.css">

<body>
  <div class="main">
    <h3>&#127811; Factory Reset &#127811;</h3>
    <p>This will erase WiFi settings and all local files (config + logs).</p>
    <p>The device will reboot into setup mode.</p>
    <p><b>Emergency recovery:</b> short D5 to GND during boot for 3 seconds to run full wipe.</p>
    <div class="row"><a class="btn btn-danger" href="/factory_confirm">Confirm Factory Reset</a></div>
    <div class="row"><a class="btn" href="/">Back</a></div>
  </div>
</body>
