<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>System Settings</title>
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <div class="main">
    <h3>&#127811; System Settings &#127811;</h3>
    <div class="row"><a class="btn" href="/">Back</a></div>
    <div class="msg" id="msg" style="display:none;"></div>
    <div class="row"><a class="btn" href="/settings/network">Networking</a></div>
    <div class="row"><a class="btn" href="/settings/time">Time Synchronization</a></div>
    <div class="row"><a class="btn" href="/settings/mqtt">MQTT Settings</a></div>
    <div class="row"><a class="btn" href="/settings/ota">OTA Settings</a></div>
    <div class="row"><a class="btn" href="/settings/backup_restore">Backup &amp; Restore</a></div>
    <div class="row"><a class="btn" href="/schedule_clear">Clear Schedule</a></div>
    <div class="row"><a class="btn" href="/ha_discovery_reset">Reset HA Discovery</a></div>
    <div class="row"><a class="btn btn-danger" href="/factory">Factory Reset</a></div>
  </div>
  <script>
    const q = new URLSearchParams(window.location.search);
    let t = '';
    if (q.get('scheduller_cleared') === '1') t = 'Schedule execution history cleared for QA.';
    if (t) {
      const m = document.getElementById('msg');
      m.style.display = 'block';
      m.textContent = t;
    }
  </script>
</body>
</html>
